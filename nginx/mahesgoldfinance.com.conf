# ==============================================================================
# Nginx Configuration for mahesgoldfinance.com
# Frontend: Vite React SPA (/var/www/mahesgoldfinance/dist)
# Backend: Node.js Express API on Port 5007 (http://127.0.0.1:5007)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mahesgoldfinance.com www.mahesgoldfinance.com;

    # Maximum file upload size for receipts / images
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Frontend Static Root (Vite dist build)
    root /var/www/mahesgoldfinance/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # Backend API Reverse Proxy (Port 5007)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;

        # Increase proxy buffer sizes to handle large JSON responses
        # (e.g. base64-encoded logo images in /api/settings)
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite hashed bundles)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Fallback (React Router / Hash Router)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages (optional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
