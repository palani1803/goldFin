<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFDF9" />
      <stop offset="80%" stop-color="#FFF8EE" />
      <stop offset="100%" stop-color="#FFF0D9" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="sunGlow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#FFFBEB" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="baseGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Reflection Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#FFF7ED" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0.8" />
    </linearGradient>

    <!-- 3D Gold Bar Gradients -->
    <!-- Top Face (Specular Sheen) -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="75%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Front Face (Rich Deep Gold) -->
    <linearGradient id="goldFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="30%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Side Face (Shaded Gold) -->
    <linearGradient id="goldSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="50%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- Bevel Highlight -->
    <linearGradient id="bevelHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FEF08A" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0.4" />
    </linearGradient>

    <!-- Arrow Body Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#FDE047" />
      <stop offset="90%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Arrow Glow Filter -->
    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Gold Bars -->
    <filter id="barShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#78350F" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="560" fill="url(#bgGrad)" />
  <rect width="1200" height="560" fill="url(#sunGlow)" />
  <rect width="1200" height="560" fill="url(#baseGlow)" />

  <!-- Floor / Perspective Ground -->
  <ellipse cx="600" cy="510" rx="650" ry="110" fill="url(#floorGrad)" opacity="0.8" />

  <!-- Background Financial Candlestick Chart (Subtle Light Gold) -->
  <g opacity="0.28" stroke="#F59E0B" stroke-width="1.2">
    <!-- Grid guidelines -->
    <line x1="80" y1="120" x2="1120" y2="120" stroke="#FDE68A" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="80" y1="200" x2="1120" y2="200" stroke="#FDE68A" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="80" y1="280" x2="1120" y2="280" stroke="#FDE68A" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="80" y1="360" x2="1120" y2="360" stroke="#FDE68A" stroke-dasharray="4 6" stroke-width="1" />

    <!-- Candlestick Wicks & Bodies -->
    <!-- Left range -->
    <line x1="120" y1="290" x2="120" y2="350" />
    <rect x="115" y="305" width="10" height="30" fill="#FBBF24" rx="1.5" />

    <line x1="160" y1="260" x2="160" y2="330" />
    <rect x="155" y="275" width="10" height="40" fill="#F59E0B" rx="1.5" />

    <line x1="200" y1="240" x2="200" y2="310" />
    <rect x="195" y="255" width="10" height="35" fill="#FBBF24" rx="1.5" />

    <line x1="240" y1="220" x2="240" y2="290" />
    <rect x="235" y="235" width="10" height="40" fill="#F59E0B" rx="1.5" />

    <line x1="280" y1="250" x2="280" y2="310" />
    <rect x="275" y="260" width="10" height="35" fill="#FBBF24" rx="1.5" />

    <!-- Mid range -->
    <line x1="330" y1="190" x2="330" y2="270" />
    <rect x="325" y="210" width="10" height="45" fill="#F59E0B" rx="1.5" />

    <line x1="380" y1="170" x2="380" y2="250" />
    <rect x="375" y="185" width="10" height="50" fill="#FBBF24" rx="1.5" />

    <line x1="430" y1="150" x2="430" y2="230" />
    <rect x="425" y="165" width="10" height="50" fill="#F59E0B" rx="1.5" />

    <line x1="480" y1="180" x2="480" y2="250" />
    <rect x="475" y="195" width="10" height="40" fill="#FBBF24" rx="1.5" />

    <!-- Rising right range -->
    <line x1="540" y1="130" x2="540" y2="210" />
    <rect x="535" y="145" width="10" height="50" fill="#F59E0B" rx="1.5" />

    <line x1="600" y1="110" x2="600" y2="190" />
    <rect x="595" y="125" width="10" height="50" fill="#FBBF24" rx="1.5" />

    <line x1="660" y1="90" x2="660" y2="170" />
    <rect x="655" y="105" width="10" height="50" fill="#F59E0B" rx="1.5" />

    <line x1="720" y1="110" x2="720" y2="180" />
    <rect x="715" y="125" width="10" height="40" fill="#FBBF24" rx="1.5" />

    <line x1="780" y1="70" x2="780" y2="150" />
    <rect x="775" y="85" width="10" height="50" fill="#F59E0B" rx="1.5" />

    <line x1="840" y1="50" x2="840" y2="130" />
    <rect x="835" y="65" width="10" height="50" fill="#F59E0B" rx="1.5" />

    <line x1="900" y1="70" x2="900" y2="140" />
    <rect x="895" y="85" width="10" height="45" fill="#FBBF24" rx="1.5" />

    <line x1="960" y1="40" x2="960" y2="110" />
    <rect x="955" y="50" width="10" height="45" fill="#F59E0B" rx="1.5" />

    <line x1="1020" y1="30" x2="1020" y2="90" />
    <rect x="1015" y="40" width="10" height="40" fill="#FBBF24" rx="1.5" />

    <line x1="1080" y1="20" x2="1080" y2="80" />
    <rect x="1075" y="30" width="10" height="40" fill="#F59E0B" rx="1.5" />

    <!-- Glowing Trend Curve behind -->
    <path d="M 100 340 Q 280 270 440 210 T 780 120 T 1100 30" fill="none" stroke="#FDE047" stroke-width="2.5" opacity="0.6" />
  </g>

  <!-- 3D GOLD BULLION BARS (5 Ascending Steps from Left to Right) -->
  <g filter="url(#barShadow)">
    <!-- BAR 1 (Step 1 - Smallest, X: 450) -->
    <g transform="translate(430, 415)">
      <!-- Base Shadow -->
      <ellipse cx="32" cy="40" rx="36" ry="8" fill="#78350F" opacity="0.3" />
      <!-- Front Face -->
      <polygon points="0,20 54,20 54,36 0,36" fill="url(#goldFront)" />
      <!-- Side Face -->
      <polygon points="54,20 64,12 64,28 54,36" fill="url(#goldSide)" />
      <!-- Top Face -->
      <polygon points="0,20 10,12 64,12 54,20" fill="url(#goldTop)" />
      <!-- Bevel Edge Line -->
      <line x1="0" y1="20" x2="54" y2="20" stroke="url(#bevelHighlight)" stroke-width="1.2" />
      <line x1="54" y1="20" x2="64" y2="12" stroke="url(#bevelHighlight)" stroke-width="1.2" />
    </g>

    <!-- BAR 2 (Step 2, X: 520) -->
    <g transform="translate(505, 360)">
      <!-- Base Shadow -->
      <ellipse cx="34" cy="95" rx="38" ry="9" fill="#78350F" opacity="0.35" />
      <!-- Front Face -->
      <polygon points="0,20 58,20 58,90 0,90" fill="url(#goldFront)" />
      <!-- Side Face -->
      <polygon points="58,20 70,10 70,80 58,90" fill="url(#goldSide)" />
      <!-- Top Face -->
      <polygon points="0,20 12,10 70,10 58,20" fill="url(#goldTop)" />
      <!-- Bevel Edge Line -->
      <line x1="0" y1="20" x2="58" y2="20" stroke="url(#bevelHighlight)" stroke-width="1.4" />
      <line x1="58" y1="20" x2="70" y2="10" stroke="url(#bevelHighlight)" stroke-width="1.4" />
    </g>

    <!-- BAR 3 (Step 3, X: 595) -->
    <g transform="translate(585, 300)">
      <!-- Base Shadow -->
      <ellipse cx="38" cy="155" rx="42" ry="10" fill="#78350F" opacity="0.4" />
      <!-- Front Face -->
      <polygon points="0,20 62,20 62,150 0,150" fill="url(#goldFront)" />
      <!-- Side Face -->
      <polygon points="62,20 76,8 76,138 62,150" fill="url(#goldSide)" />
      <!-- Top Face -->
      <polygon points="0,20 14,8 76,8 62,20" fill="url(#goldTop)" />
      <!-- Bevel Edge Line -->
      <line x1="0" y1="20" x2="62" y2="20" stroke="url(#bevelHighlight)" stroke-width="1.5" />
      <line x1="62" y1="20" x2="76" y2="8" stroke="url(#bevelHighlight)" stroke-width="1.5" />
    </g>

    <!-- BAR 4 (Step 4, X: 675) -->
    <g transform="translate(670, 230)">
      <!-- Base Shadow -->
      <ellipse cx="42" cy="225" rx="46" ry="11" fill="#78350F" opacity="0.45" />
      <!-- Front Face -->
      <polygon points="0,20 66,20 66,220 0,220" fill="url(#goldFront)" />
      <!-- Side Face -->
      <polygon points="66,20 82,6 82,206 66,220" fill="url(#goldSide)" />
      <!-- Top Face -->
      <polygon points="0,20 16,6 82,6 66,20" fill="url(#goldTop)" />
      <!-- Bevel Edge Line -->
      <line x1="0" y1="20" x2="66" y2="20" stroke="url(#bevelHighlight)" stroke-width="1.6" />
      <line x1="66" y1="20" x2="82" y2="6" stroke="url(#bevelHighlight)" stroke-width="1.6" />
    </g>

    <!-- BAR 5 (Step 5 - Tallest, X: 765) -->
    <g transform="translate(760, 150)">
      <!-- Base Shadow -->
      <ellipse cx="46" cy="305" rx="50" ry="12" fill="#78350F" opacity="0.5" />
      <!-- Front Face -->
      <polygon points="0,20 72,20 72,300 0,300" fill="url(#goldFront)" />
      <!-- Side Face -->
      <polygon points="72,20 90,4 90,284 72,300" fill="url(#goldSide)" />
      <!-- Top Face -->
      <polygon points="0,20 18,4 90,4 72,20" fill="url(#goldTop)" />
      <!-- Bevel Edge Line -->
      <line x1="0" y1="20" x2="72" y2="20" stroke="url(#bevelHighlight)" stroke-width="1.8" />
      <line x1="72" y1="20" x2="90" y2="4" stroke="url(#bevelHighlight)" stroke-width="1.8" />
    </g>
  </g>

  <!-- DYNAMIC UPWARD GOLDEN GROWTH ARROW -->
  <g>
    <!-- Arrow Ambient Glow Tube -->
    <path d="M 120 450 C 350 440, 560 380, 800 130" fill="none" stroke="#F59E0B" stroke-width="28" stroke-linecap="round" opacity="0.25" filter="url(#arrowGlow)" />
    <path d="M 120 450 C 350 440, 560 380, 800 130" fill="none" stroke="#FDE047" stroke-width="16" stroke-linecap="round" opacity="0.5" filter="url(#arrowGlow)" />

    <!-- Main Solid Arrow Stem Curve -->
    <path d="M 120 450 C 350 440, 560 380, 800 130" fill="none" stroke="url(#arrowGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 120 450 C 350 440, 560 380, 800 130" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Large 3D Gold Arrowhead -->
    <g transform="translate(800, 130) rotate(-46)" filter="url(#barShadow)">
      <!-- Arrowhead polygon -->
      <polygon points="0,0 -24,48 -8,40 -20,62 0,46 20,62 8,40 24,48" fill="url(#goldTop)" stroke="#F59E0B" stroke-width="1.5" />
      <!-- Arrowhead center ridge -->
      <line x1="0" y1="0" x2="0" y2="46" stroke="#FFFFFF" stroke-width="2.5" />
    </g>

    <!-- Super Starburst Flare at Arrowhead Tip -->
    <g transform="translate(800, 130)" filter="url(#sparkleGlow)">
      <circle cx="0" cy="0" r="16" fill="#FFFFFF" opacity="0.9" />
      <circle cx="0" cy="0" r="32" fill="#FDE047" opacity="0.5" />
      <polygon points="0,-48 6,-10 48,0 6,10 0,48 -6,10 -48,0 -6,-10" fill="#FFFFFF" opacity="0.95" />
      <polygon points="0,-32 4,-8 32,0 4,8 0,32 -4,8 -32,0 -4,-8" fill="#FACC15" opacity="0.75" />
      <polygon points="-24,-24 -3,-7 -7,-3 24,24 7,3 3,7" fill="#FFFFFF" opacity="0.8" />
      <polygon points="24,-24 3,-7 7,-3 -24,24 -7,3 -3,7" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>

  <!-- SPARKLING GOLDEN DUST & BURSTING PARTICLES ALONG TRAJECTORY -->
  <g filter="url(#sparkleGlow)">
    <!-- Base Particle Clusters -->
    <circle cx="150" cy="445" r="3" fill="#FFFFFF" />
    <circle cx="165" cy="438" r="4.5" fill="#FDE047" />
    <circle cx="180" cy="452" r="2.5" fill="#F59E0B" />
    <circle cx="210" cy="435" r="5" fill="#FFFFFF" />
    <circle cx="225" cy="448" r="3" fill="#FBBF24" />
    <circle cx="250" cy="425" r="4" fill="#FDE047" />
    <circle cx="280" cy="420" r="6" fill="#FFFFFF" />
    <circle cx="310" cy="405" r="4.5" fill="#F59E0B" />
    <circle cx="340" cy="395" r="5.5" fill="#FFFFFF" />
    <circle cx="370" cy="385" r="3.5" fill="#FDE047" />

    <!-- Mid Particle Flow -->
    <circle cx="400" cy="370" r="6" fill="#FFFFFF" />
    <circle cx="430" cy="345" r="4" fill="#FBBF24" />
    <circle cx="460" cy="325" r="6.5" fill="#FFFFFF" />
    <circle cx="490" cy="300" r="5" fill="#FDE047" />
    <circle cx="520" cy="280" r="7" fill="#FFFFFF" />
    <circle cx="550" cy="255" r="4.5" fill="#F59E0B" />
    <circle cx="580" cy="235" r="6" fill="#FFFFFF" />
    <circle cx="610" cy="210" r="5.5" fill="#FDE047" />

    <!-- Upper Explosive Gold Particle Flow -->
    <circle cx="640" cy="190" r="7.5" fill="#FFFFFF" />
    <circle cx="670" cy="170" r="5" fill="#FBBF24" />
    <circle cx="700" cy="150" r="8" fill="#FFFFFF" />
    <circle cx="730" cy="135" r="6" fill="#FDE047" />
    <circle cx="760" cy="120" r="9" fill="#FFFFFF" />
    <circle cx="790" cy="105" r="5.5" fill="#F59E0B" />
    <circle cx="830" cy="115" r="7" fill="#FDE047" />
    <circle cx="850" cy="95" r="6" fill="#FFFFFF" />
    <circle cx="880" cy="80" r="4" fill="#FBBF24" />

    <!-- Cross Star Sparkles -->
    <g transform="translate(230, 420)">
      <polygon points="0,-12 2,-3 12,0 2,3 0,12 -2,3 -12,0 -2,-3" fill="#FFFFFF" />
    </g>
    <g transform="translate(360, 375)">
      <polygon points="0,-16 3,-4 16,0 3,4 0,16 -3,4 -16,0 -3,-4" fill="#FEF08A" />
    </g>
    <g transform="translate(480, 310)">
      <polygon points="0,-20 4,-5 20,0 4,5 0,20 -4,5 -20,0 -4,-5" fill="#FFFFFF" />
    </g>
    <g transform="translate(620, 220)">
      <polygon points="0,-24 5,-6 24,0 5,6 0,24 -5,6 -24,0 -5,-6" fill="#FEF08A" />
    </g>
    <g transform="translate(740, 140)">
      <polygon points="0,-28 6,-7 28,0 6,7 0,28 -6,7 -28,0 -6,-7" fill="#FFFFFF" />
    </g>
    <g transform="translate(860, 90)">
      <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#FDE047" />
    </g>
    <g transform="translate(930, 60)">
      <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#FFFFFF" />
    </g>
  </g>
</svg>
